name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # frontend: strict ESM parse (sloppy node --check lets TS-annotations
      # slip through) + regression guard: the ?v= cache busting was removed in
      # favor of ETag/Last-Modified revalidation — never reintroduce it
      - run: |
          for f in public/js/*.js; do node --input-type=module --check < "$f"; done
          N=$(grep -rl '?v=' public/ | wc -l)
          test "$N" = "0" || (echo "❌ cache-buster ?v= réintroduit (fichiers: $N)" && exit 1)
      - run: bun run typecheck
      - run: bun run check